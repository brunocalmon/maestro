name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      contents: read
    env:
      # Some real-command tests fetch skill sources from GitHub
      # (framework/skills installers). Unauthenticated, a shared Actions
      # runner IP routinely hits GitHub's anonymous rate limit — both
      # installers already check GH_TOKEN/GITHUB_TOKEN for exactly this;
      # the repo-scoped token Actions provides automatically is enough.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O instalador do Framework resolve a CLI de skills por `npx skills`, sem
      # versão: o `skills` que o package.json fixa não é o que roda, e cada
      # execução depende da árvore que o npx monta em ~/.npm/_npx/<hash>. No
      # runner essa árvore chegou incompleta e derrubou a instalação com
      # ERR_MODULE_NOT_FOUND em `yaml` — a falha intermitente que custou três
      # investigações. Este é o ponto de extensão do próprio Framework para
      # apontar a resolução para outro lugar: a cópia local já fixada.
      TRACEABILITY_NPX_COMMAND: ${{ github.workspace }}/scripts/pinned-skills.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Runs install, the checksum-gated build (scripts/check-version-
      # checksum.mjs runs as `prebuild`, before tsc) and the full suite, in
      # that order, recording each step's time — the same three steps a
      # person runs by hand, and the timings tests/budget.test.ts and
      # tests/cycle-timings.test.ts assert on. Fails here, on every commit —
      # main or PR — whenever src/ or resources/ changed without
      # package.json's version moving with it.
      - name: Verify (install, build, test)
        run: npm run verify

      - name: Test with coverage
        # set -o pipefail: without it, `tee`'s own exit code (0) hides a
        # failing `vitest run` and the step reports success regardless —
        # confirmed for real, this masked test failures on the first run
        # of this workflow.
        run: |
          set -o pipefail
          npx vitest run --coverage | tee coverage.txt

      - name: Post coverage as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Test Coverage Report\n\n\`\`\`\n${coverage}\n\`\`\``,
            });

  docker:
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.extract_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version extracted: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          IMAGE_NAME="${{ vars.DOCKER_USERNAME && format('{0}/maestro', vars.DOCKER_USERNAME) || 'maestro' }}"
          TAG="${{ steps.extract_version.outputs.VERSION }}"
          docker build -t "$IMAGE_NAME:$TAG" .
          echo "Built Docker image: $IMAGE_NAME:$TAG"

      - name: Check if Docker image tag exists
        id: check_tag_exists
        run: |
          IMAGE_NAME="${{ vars.DOCKER_USERNAME && format('{0}/maestro', vars.DOCKER_USERNAME) || 'maestro' }}"
          TAG="${{ steps.extract_version.outputs.VERSION }}"
          response=$(curl --write-out "%{http_code}" --silent --output /dev/null \
            -u "${{ vars.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
            "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$TAG/")
          if [ "$response" -eq 200 ]; then
            echo "Docker image tag $IMAGE_NAME:$TAG already exists. Skipping push."
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Docker image tag $IMAGE_NAME:$TAG does not exist. Proceeding with push."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to Docker Hub
        if: env.TAG_EXISTS == 'false'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        if: env.TAG_EXISTS == 'false'
        run: |
          IMAGE_NAME="${{ vars.DOCKER_USERNAME && format('{0}/maestro', vars.DOCKER_USERNAME) || 'maestro' }}"
          TAG="${{ steps.extract_version.outputs.VERSION }}"
          docker push "$IMAGE_NAME:$TAG"

  release:
    needs: docker
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          tag=$(git tag -l "${{ needs.docker.outputs.version }}")
          if [[ -n "$tag" ]]; then
            echo "Tag ${{ needs.docker.outputs.version }} already exists."
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Tag ${{ needs.docker.outputs.version }} does not exist."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Set git user identity
        run: |
          git config --global user.email "brunoxaviercalmon.br@gmail.com"
          git config --global user.name "${{ github.actor }}"

      - name: Create and push tag
        if: env.TAG_EXISTS == 'false'
        run: |
          git tag -a "${{ needs.docker.outputs.version }}" -m "Version ${{ needs.docker.outputs.version }}"
          git push origin "${{ needs.docker.outputs.version }}"
