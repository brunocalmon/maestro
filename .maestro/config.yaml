language:
  default: en_US
  exceptions: []
project:
  prog_lang: TypeScript
  runtime: Node.js
  package_manager: ""
  framework: ""
  test_framework: Vitest
  documentation_style: ""
system:
  os: linux
  distro: ""
  ram_gb: null
  cpu: ""
  gpu: ""
  baremetal: null
  container: null
git:
  default: ignored
  groups:
    common_rules_config:
      description: config.yaml itself — shared across the team by default
      paths:
        - .maestro/config.yaml
      ignored: false
    common_rules_state:
      description: maestro operational state (install.json, extensions.json, quarantine/)
      paths:
        - .maestro/install.json
        - .maestro/extensions.json
        - .maestro/quarantine/
      ignored: true
    installed_skills:
      description: Skills installed for agents —
        reinstallable, like dependencies
      paths:
        - .claude/skills/
        - .agents/skills/
      ignored: true
    code_review_graph:
      description: code-review-graph analysis output — path not yet inspected in this
        project
      paths: []
      ignored: true
    context_mode:
      description: context-mode session/context-usage state — path not yet inspected
        in this project
      paths: []
      ignored: true
maestro:
  identity:
    name:
      value: maestro
      mode: required
    description:
      value: .maestro/subagents/maestro/description.md
      mode: suggested
  cognition:
    model:
      value: ""
      mode: suggested
    context_budget:
      value: 0.7
      mode: suggested
    reasoning_effort:
      value: medium
      mode: suggested
  instruction:
    behavior:
      value: .maestro/subagents/maestro/behavior.md
      mode: suggested
    additional_behavior:
      value: ""
      mode: suggested
  capability:
    skills:
      value: []
      mode: suggested
    tools:
      value: []
      mode: suggested
    mcp_servers:
      value: []
      mode: suggested
  execution:
    runtime:
      value: auto
      mode: suggested
    concurrency:
      value: 1
      mode: suggested
  subagents: []
  task_types:
    ajuste_pontual:
      context_window_min:
        value: 8192
        mode: suggested
    trabalho_em_arquivos:
      context_window_min:
        value: 32768
        mode: suggested
    leitura_ampla:
      context_window_min:
        value: 131072
        mode: suggested
